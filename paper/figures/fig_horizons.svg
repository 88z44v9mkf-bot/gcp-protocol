<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220"><rect width="860" height="220" fill="#fff"/><line x1="60" y1="120" x2="800" y2="120" stroke="#222" stroke-width="2"/><circle cx="80" cy="120" r="6" fill="#3d5a80"/><text x="80" y="90" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H1: 0–6 months</text><text x="80" y="150" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">assisted: human initiates</text><text x="80" y="164" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">agent prepares</text><text x="80" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">human approves</text><circle cx="330" cy="120" r="6" fill="#3d5a80"/><text x="330" y="90" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H2: 6–18 months</text><text x="330" y="150" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">delegated: mandate</text><text x="330" y="164" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">proactive service</text><text x="330" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">exception review</text><circle cx="580" cy="120" r="6" fill="#3d5a80"/><text x="580" y="90" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H3: 18–36 months</text><text x="580" y="150" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">agent-native: agents negotiate</text><text x="580" y="164" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">human audits policy</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" fill="#fff"/><line x1="40" y1="45" x2="860" y2="45" stroke="#222" stroke-width="1.4"/><circle cx="160" cy="45" r="5" fill="#3d5a80"/><text x="160" y="30" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H1  0–6 months</text><rect x="50" y="72" width="220" height="176" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="160" y="100" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold">assisted commerce</text><text x="160" y="126" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human initiates</text><text x="160" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">agent searches and prepares</text><text x="160" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human approves payment</text><text x="160" y="204" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">GCP: bounded step-up</text><circle cx="440" cy="45" r="5" fill="#3d5a80"/><text x="440" y="30" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H2  6–18 months</text><rect x="330" y="72" width="220" height="176" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="440" y="100" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold">delegated commerce</text><text x="440" y="126" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human sets mandate</text><text x="440" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">agent acts proactively</text><text x="440" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human reviews exceptions</text><text x="440" y="204" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">GCP: revocable policy</text><circle cx="720" cy="45" r="5" fill="#3d5a80"/><text x="720" y="30" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold">H3  18–36 months</text><rect x="610" y="72" width="220" height="176" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="720" y="100" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold">agent-native commerce</text><text x="720" y="126" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">agents negotiate</text><text x="720" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human sets policy</text><text x="720" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">human audits outcomes</text><text x="720" y="204" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal">GCP: agent contracts</text><text x="450" y="278" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555">The three patterns may overlap within 12–24 months; GCP is layered so H1 deployments become the policy/evidence layer for H2 and H3.</text></svg>
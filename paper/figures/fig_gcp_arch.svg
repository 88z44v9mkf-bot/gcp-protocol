<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs><rect width="900" height="590" fill="#fff"/><rect x="50" y="20" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="51.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold" fill="#222">PA runtime: mobile app · PC · cockpit · third-party assistant (Doubao, Qwen, ChatGPT, Claude, ...)</text><rect x="50" y="100" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="131.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold" fill="#222">GCP client: intent → authorization check → plan → execute → evidence</text><rect x="50" y="180" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="211.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="bold" fill="#222">GCP core: discovery | catalog + vehicle context | cart/order | booking | payment intent | fulfillment | aftercare</text><rect x="50" y="260" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="291.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal" fill="#222">Safety and compliance: compatibility · recall · insurance · cockpit rule · no prompt override</text><rect x="50" y="340" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="371.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal" fill="#222">Evidence ledger: consent · checks · settlement · hash chain      Typed error bus: retryable · requires_human · alternatives</text><rect x="50" y="420" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="451.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal" fill="#222">Adapters: Poppy | UCP | ACP | OEM DMS/ERP | payment providers</text><rect x="50" y="500" width="800" height="55" rx="6" fill="#fff" stroke="#222" stroke-width="1.1"/><text x="450.0" y="531.2" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="10.5" font-weight="normal" fill="#222">Merchants · dealers · service centers · insurers · payment rails</text><path d="M450,75 L450,100" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><path d="M450,155 L450,180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><path d="M450,235 L450,260" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><path d="M450,315 L450,340" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><path d="M450,395 L450,420" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><path d="M450,475 L450,500" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/></svg>